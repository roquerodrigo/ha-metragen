[project]
# Este repositório é uma integração custom do Home Assistant entregue como
# ``custom_components/metragen/``, não um pacote instalável por pip. O bloco
# ``[project]`` existe para que o uv reconheça o diretório como um projeto
# gerenciado; ``[tool.uv] package = false`` impede o uv de tentar
# buildar/instalar o projeto.
name = "ha-metragen"
version = "0.1.2"
description = "Integração do Home Assistant para o portal Metragen de medição de água e gás"
requires-python = ">=3.14.2"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "homeassistant==2026.7.2",
    "pre-commit==4.6.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.346",
]
lint = [
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=custom_components/metragen",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/metragen"]
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# A configuração do Ruff espelha o pyproject.toml do core do Home Assistant.
[tool.ruff]
target-version = "py314"

[tool.ruff.format]
exclude = ["*.md"]  # o ruff 0.16 formata blocos Python em Markdown; a documentação mantém o próprio layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # expressões tipadas dinamicamente (typing.Any) são proibidas
    "D203",    # no-blank-line-before-class (incompatível com o formatter)
    "D212",    # multi-line-summary-first-line (incompatível com o formatter)
    "COM812",  # incompatível com o formatter
    "ISC001",  # incompatível com o formatter
    "CPY001",  # este projeto não usa cabeçalhos de copyright
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# A dataclass de runtime e o pacote de sensores moram em subpacotes, mas
# referenciam o ApiClient, o coordinator e a entidade base do pacote pai; o
# import relativo ao pai é a única forma que resolve tanto no mypy quanto no
# runtime do HA.
"**/data/runtime.py" = ["TID252"]
"**/sensor/*.py" = ["TID252"]
"tests/**" = [
    "S101",     # assert é normal no pytest
    "S105",     # hardcoded-password-string é aceitável em credenciais falsas de teste
    "S106",     # hardcoded-password-func-arg é aceitável em credenciais falsas de teste
    "D",        # testes não exigem docstrings
    "ANN",      # testes não exigem anotações de tipo
    "ARG001",   # o pytest usa as fixtures implicitamente
    "PLC0415",  # imports locais dentro de fixtures são intencionais
    "SLF001",   # testar atributos privados e métodos internos do HA é intencional
    "PLR2004",  # números mágicos em asserts de teste são aceitáveis
]
