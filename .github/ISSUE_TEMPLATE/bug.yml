---
name: "Relato de bug"
description: "Relate um bug na integração"
body:
- type: markdown
  attributes:
    value: Antes de abrir uma nova issue, pesquise nas issues existentes para ver se outras pessoas já tiveram o mesmo problema.
- type: textarea
  attributes:
    label: "Detalhes da Integridade do sistema"
    description: "Cole os dados do card Integridade do sistema do Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: Habilitei os logs de debug na minha instalação.
        required: true
      - label: Preenchi o template da issue da melhor forma que pude.
        required: true
      - label: Esta issue trata de apenas 1 problema (se você tem vários problemas, abra uma issue para cada um).
        required: true
      - label: Esta issue não duplica nenhuma das [issues anteriores](../../issues?q=is%3Aissue+label%3A%22Bug%22+).
        required: true
- type: textarea
  attributes:
    label: "Descreva o problema"
    description: "Uma descrição clara e concisa do problema."
  validations:
    required: true
- type: textarea
  attributes:
    label: Passos para reproduzir
    description: "Sem os passos para reproduzir, será difícil corrigir. É muito importante preencher esta parte. Issues sem ela serão fechadas."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Logs de debug"
    description: "Para habilitar os logs de debug, consulte https://www.home-assistant.io/integrations/logger/. O log **precisa** incluir _tudo_, da inicialização do Home Assistant até o ponto em que o problema aparece."
    render: text
  validations:
    required: true

- type: textarea
  attributes:
    label: "Dump de diagnóstico"
    description: "Arraste o arquivo de diagnóstico para cá. (veja https://www.home-assistant.io/integrations/diagnostics/ para mais informações)"
