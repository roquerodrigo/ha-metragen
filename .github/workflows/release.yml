name: Release

# Condicionado a um CI bem-sucedido, e não ao push em si. A metade
# `workflow_run.event == 'push'` da condição é o que impede um pull request
# com CI verde de gerar uma release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Release
        id: release
        uses: roquerodrigo/release-autopilot@latest
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: roquerodrigo/workflows/.github/workflows/publish-hacs-zip.yml@main
    with:
      domain: metragen
      ref: ${{ needs.release.outputs.tag }}
