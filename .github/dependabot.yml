# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
    ignore:
      # O Home Assistant e o harness de teste sobem juntos, à mão: o pin
      # acompanha a chave ``homeassistant`` do hacs.json, e cada versão do
      # pytest-homeassistant-custom-component fixa um Home Assistant exato,
      # junto com pytest, pytest-asyncio e pytest-cov.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
