# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "homeassistant"
    ignore:
      # O Dependabot não deve atualizar o Home Assistant — esse pin acompanha
      # a chave ``homeassistant`` do hacs.json (definida à mão).
      - dependency-name: "homeassistant"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
